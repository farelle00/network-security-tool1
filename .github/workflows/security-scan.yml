name: Network Security Tool image security

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build tool image
        run: docker build -t network-security-tool:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: network-security-tool:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
